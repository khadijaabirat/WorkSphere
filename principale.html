<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkSphere</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header></header>
    <div id="modelform" class="backmodlform">
      <div class="modelformilaire">
        <div class="line1form">
          <h1>Ajouter un personnel</h1>
          <button type="button" id="fermerformulaire" class="fermerformulaire">x</button>
        </div>
        <form id="form" class="form">
          <div class="divform">
            <label for="nom">le nom:</label>
            <input id="nom" type="text" name="nom" placeholder="saisirez le nom" />
            
          </div>
          <div class="divform">
            <label>roles autorises:</label>
            <select>
              <option value="saisirez le role">saisirez le role</option>
              <option value="receptionniste">receptionniste</option>
              <option value="technicien">technicien</option>
              <option value="manager">manager</option>
              <option value="agentdesecurite">agent de securite</option>
              <option value="nettoyage">nettoyage</option>
            </select>
          </div>

          <div class="divform">
            <label for="photo">photo :</label>
            <input id="photo" type="url" name="photo" placeholder="saisirez la photo" />
          </div>
          <div class="rounde divform">
            <img    id="afficherphoto" src="./istockphoto-513727339-612x612.jpg"/>
          </div>
          <div class="divform">
            <label for="email">email :</label>
            <input id="email" type="email" name="email" placeholder="saisirer l'email" />
          </div>
          <div class="divform">
            <label for="telephone">telephone :</label>
            <input id="telephone" type="text" name="telephone" placeholder="saisirez le telephone" />
          </div>
          <div class="divform">
            <label  for="experiences">experiences :</label>
            <div class="ajoutex">
              <div>
                <div id="ajoutex"></div>
              </div>
              <button id="ajouterexperience" class="ajouterexperience" type="button">+</button>
            </div>
          </div>
           <p id="error-msg"></p>
          <button id="btnformajouterpersonel" class="btnformajouterpersonel" type="submit">ajouter</button>
        </form>
      </div>
    </div>
    <main>
      <div class="cantainer">
        <div class="Sidebar">
          <h2>Unassigned Staff</h2>
          <button id="AddNewWorker" class="AddNewWorker">Add New Worker</button>
        </div>
        <div class="MainArea">
          <div class="Réception chambre"><button class="ajouterpersonelemain">+</button> </div>
          <div class="Salledeconférenceé chambre"><button class="ajouterpersonelemain">+</button></div>
          <div class="Salledupersonnel chambre"><button class="ajouterpersonelemain">+</button></div>
          <div class="Salled’archives chambre"><button class="ajouterpersonelemain">+</button></div>
          <div class="Salledesserveur chambre"><button class="ajouterpersonelemain">+</button></div>
          <div class="Salledesécurité chambre"><button class="ajouterpersonelemain">+</button></div>
        </div>
      </div>
    </main>
    <footer></footer>
    <script src="./javascript.js"></script>
  </body>
</html>
