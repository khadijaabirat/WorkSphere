<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkSphere</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Orbit&display=swap');
</style>
  </head>
  <body>
    <header></header>
    <div id="modelform" class="backmodlform">
      <div class="modelformilaire">
        <div class="line1form">
          <h1>Ajouter un personnel</h1>
          <button type="button" id="fermerformulaire" class="fermerformulaire">x</button>
        </div>
        <form id="form" class="form">
          <div class="divform">
            <label for="nom">le nom:</label>
            <input id="nom" type="text" name="nom" placeholder="saisirez le nom" />
            
          </div>
          <div class="divform">
            <label>roles autorises:</label>
            <select>
              <option value="" disabled selected>saisirez le role</option>
              <option value="receptionniste">receptionniste</option>
              <option value="technicien">technicien</option>
              <option value="manager">manager</option>
              <option value="agentdesecurite">agent de securite</option>
              <option value="nettoyage">nettoyage</option>
            </select>
          </div>
          <div class="divform">
            <label for="photo">photo :</label>
            <input id="photo" type="url" name="photo" placeholder="saisirez la photo" />
          </div>
          <div class="rounde divform">
            <img    id="afficherphoto" src="./images/istockphoto-513727339-612x612.jpg"/>
          </div>
          <div class="divform">
            <label for="email">email :</label>
            <input id="email" type="email" name="email" placeholder="saisirer l'email" />
          </div>
          <div class="divform">
            <label for="telephone">telephone :</label>
            <input id="telephone" type="text" name="telephone" placeholder="saisirez le telephone" />
          </div>
          <div class="divform">
            <label >experiences :</label>
            <div class="ajoutex">
              <div>
                <div id="ajoutex"></div>
              </div>
              <button id="ajouterexperience" class="ajouterexperience" type="button">+</button>
            </div>
          </div>
           <p id="error-msg" class="error-msg"></p>
          <button id="btnformajouterpersonel" class="btnformajouterpersonel" type="submit">ajouter</button>
        </form>
      </div>
    </div>


    <div id="modelzone" class="backmodlzone">
      <div class="modelzone">
        <div  class="line1form">
         <h1>Ajouter un personnel a la zone</h1>
            <button type="button" id="btnfermerzone" class="fermerformulaire">x</button>
        </div>  
    <div id="divezone">     
     </div>
      </div>
    </div>



     <div id="modelpersonel" class="backmodlperson">
      <div class="modelperson">
        <div  class="line1form">
         <h1>les informations :</h1>
            <button type="button" id="btnfermerperson" class="fermerformulaire">x</button>
        </div>     
    <div id="diveinfo"> </div>
      </div>
    </div>


    <main>
      <div class="cantainer">
        <div class="Sidebar">
          <div class="fls">
          <h3>Unassigned Staff</h3>
          <button id="AddNewWorker" class="AddNewWorker">Add New Worker</button>
          </div>
          <div id="outzone" class="outzone">
          </div>
        </div>
        <div class="MainArea">
        
          <div class="Sreception chambre">
          <div><button class="ajtmain btnreception">+</button>
              <div class="zoneMessage" style="color:red; margin-top:5px;"></div>
          </div> 
          <div id="Sreception"></div>
          </div>
          <div class="Sconfrence chambre">
           <div><button class="ajtmain btnconference">+</button>
              <div class="zoneMessage" style="color:red; margin-top:5px;"></div>

          </div> 
               <div id="Sconfrence"></div> 
          </div>
          <div class="Spersonnel chambre">
           <div> <button class="ajtmain btnpersonnel">+</button></div>
                         <div class="zoneMessage" style="color:red; margin-top:5px;"></div>

               <div id="Spersonnel"></div> 
          </div>
          <div class="Sarchives chambre">
            <div><button class="ajtmain btnarchive">+</button></div>
                          <div class="zoneMessage" style="color:red; margin-top:5px;"></div>

               <div id="Sarchives"></div> 
          </div>
          <div class="Sserveur chambre">
            <div><button class="ajtmain btnserveur">+</button></div> 
                          <div class="zoneMessage" style="color:red; margin-top:5px;"></div>

               <div id="Sserveur"></div> 
          </div>
          <div class="Ssecurite chambre">
             <div><button class="ajtmain btnsecurite">+</button></div>
                           <div class="zoneMessage" style="color:red; margin-top:5px;"></div>

               <div id="Ssecurite"></div> 
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
    <script src="./script.js"></script>
  </body>
</html>
